<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Add Book</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><div class="form-container"><h1>Add New Book</h1>
{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
<form method="POST"><label>Book ID</label><input type="text" name="book_id" required><label>Book Title</label><input type="text" name="title" required><label>Author Name</label><input type="text" name="author" required><button type="submit">Add Book</button></form>
<a class="back-link" href="{{ url_for('index') }}">Back to Dashboard</a></div></body></html>
